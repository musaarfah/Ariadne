name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ariadne
          POSTGRES_PASSWORD: ariadne
          POSTGRES_DB: ariadne
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U ariadne"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Type check
        run: mypy ariadne

      - name: Migrations match models
        run: |
          alembic upgrade head
          alembic check

      - name: Tests
        run: pytest -q

      # From Phase 1.7 onward this step runs the shuffle test, so a refactor that silently
      # breaks the shrinkage turns the build red. See docs/Ariadne.MD §10.
      - name: Negative controls
        run: echo "not yet implemented — added in Phase 1.7"
